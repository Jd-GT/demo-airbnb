components:
  schemas:
    Amenity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        icon_key:
          type: string
          maxLength: 80
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    Availability:
      type: object
      properties:
        property_id:
          type: string
          format: uuid
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
      required:
      - check_in
      - check_out
      - property_id
    Contact:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 30
        type:
          $ref: '#/components/schemas/TypeEnum'
        commission_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Only applies for AGENT type contacts.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    Lead:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        contact:
          type: string
          format: uuid
        source:
          type: string
          format: uuid
          nullable: true
        stage:
          $ref: '#/components/schemas/StageEnum'
        desired_check_in:
          type: string
          format: date
          nullable: true
        desired_check_out:
          type: string
          format: date
          nullable: true
        expected_revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - contact
      - created_at
      - id
      - updated_at
    PatchedAmenity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        icon_key:
          type: string
          maxLength: 80
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedContact:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 30
        type:
          $ref: '#/components/schemas/TypeEnum'
        commission_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Only applies for AGENT type contacts.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedLead:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        contact:
          type: string
          format: uuid
        source:
          type: string
          format: uuid
          nullable: true
        stage:
          $ref: '#/components/schemas/StageEnum'
        desired_check_in:
          type: string
          format: date
          nullable: true
        desired_check_out:
          type: string
          format: date
          nullable: true
        expected_revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedProperty:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 160
        address:
          type: string
        capacity_adults:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        capacity_kids:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        base_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        cleaning_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        amenities:
          type: array
          items:
            $ref: '#/components/schemas/Amenity'
          readOnly: true
        amenity_ids:
          type: array
          items:
            type: string
            format: uuid
          writeOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedTenantUserUpdate:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 160
        system_role:
          $ref: '#/components/schemas/SystemRoleEnum'
        is_active:
          type: boolean
        role_id:
          type: string
          format: uuid
          nullable: true
    Property:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 160
        address:
          type: string
        capacity_adults:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        capacity_kids:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        base_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        cleaning_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        amenities:
          type: array
          items:
            $ref: '#/components/schemas/Amenity'
          readOnly: true
        amenity_ids:
          type: array
          items:
            type: string
            format: uuid
          writeOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - amenities
      - base_price
      - created_at
      - id
      - name
      - updated_at
    Quote:
      type: object
      properties:
        property_id:
          type: string
          format: uuid
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
      required:
      - check_in
      - check_out
      - property_id
    Reservation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        property:
          type: string
          format: uuid
        guest:
          type: string
          format: uuid
        agent:
          type: string
          format: uuid
          nullable: true
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        nights:
          type: integer
          readOnly: true
        subtotal_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        cleaning_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        status:
          $ref: '#/components/schemas/ReservationStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - check_in
      - check_out
      - cleaning_fee
      - created_at
      - guest
      - id
      - nights
      - property
      - subtotal_amount
      - total_amount
      - updated_at
    ReservationCreate:
      type: object
      properties:
        property_id:
          type: string
          format: uuid
        guest_id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
          nullable: true
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        status:
          allOf:
          - $ref: '#/components/schemas/ReservationCreateStatusEnum'
          default: CONFIRMED
      required:
      - check_in
      - check_out
      - guest_id
      - property_id
    ReservationCreateStatusEnum:
      enum:
      - DRAFT
      - CONFIRMED
      - CANCELLED
      type: string
      description: |-
        * `DRAFT` - DRAFT
        * `CONFIRMED` - CONFIRMED
        * `CANCELLED` - CANCELLED
    ReservationStatusEnum:
      enum:
      - DRAFT
      - CONFIRMED
      - CANCELLED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `CONFIRMED` - Confirmed
        * `CANCELLED` - Cancelled
    StageEnum:
      enum:
      - NEW
      - QUOTED
      - WON
      - LOST
      type: string
      description: |-
        * `NEW` - New
        * `QUOTED` - Quoted
        * `WON` - Won
        * `LOST` - Lost
    SystemRoleEnum:
      enum:
      - OWNER
      - MEMBER
      - CLEANER
      type: string
      description: |-
        * `OWNER` - OWNER
        * `MEMBER` - MEMBER
        * `CLEANER` - CLEANER
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 160
        subdomain:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        branding_config: {}
        integration_config: {}
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - subdomain
      - updated_at
    TenantCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
        subdomain:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        branding_config: {}
        integration_config: {}
        owner_email:
          type: string
          format: email
        owner_full_name:
          type: string
          maxLength: 160
        owner_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - name
      - owner_email
      - owner_full_name
      - owner_password
      - subdomain
    TenantRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        permissions: {}
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    TenantRoleSimple:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
      required:
      - id
      - name
    TenantUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
        system_role:
          allOf:
          - $ref: '#/components/schemas/SystemRoleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_primary_owner:
          type: boolean
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/TenantRoleSimple'
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - full_name
      - id
      - is_active
      - is_primary_owner
      - role
      - system_role
    TenantUserCreate:
      type: object
      properties:
        email:
          type: string
          format: email
        full_name:
          type: string
          maxLength: 160
        password:
          type: string
          writeOnly: true
          minLength: 8
        system_role:
          allOf:
          - $ref: '#/components/schemas/SystemRoleEnum'
          default: MEMBER
        role_id:
          type: string
          format: uuid
          nullable: true
      required:
      - email
      - full_name
      - password
    TenantUserUpdate:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 160
        system_role:
          $ref: '#/components/schemas/SystemRoleEnum'
        is_active:
          type: boolean
        role_id:
          type: string
          format: uuid
          nullable: true
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    TypeEnum:
      enum:
      - GUEST
      - AGENT
      - PLATFORM
      type: string
      description: |-
        * `GUEST` - Guest
        * `AGENT` - Agent
        * `PLATFORM` - Platform
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
